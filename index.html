<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schwarz-Weiß-Bild zu SVG</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel controls">
        <h1>Schwarze Form als SVG</h1>
        <p class="subtitle">
          Lade ein Schwarz-Weiß-Bild hoch. Die App erkennt alle schwarzen Pixel,
          zeichnet deren Konturen nach und exportiert daraus eine transparente SVG-Datei.
        </p>

        <form id="parameter-form" class="form-grid" autocomplete="off">
          <label class="full-width">
            Schwarz-Weiß-Bild
            <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" />
          </label>
          <label>
            Schwellenwert für Schwarz
            <input type="range" name="threshold" min="0" max="255" value="128" />
          </label>
          <label>
            Glättung
            <input type="number" name="tolerance" min="0" max="10" step="0.05" value="0.15" />
          </label>
          <label class="checkbox-row full-width">
            <input type="checkbox" name="crop" checked />
            SVG auf erkannte Form zuschneiden
          </label>
        </form>

        <div class="actions">
          <button id="export-btn" type="button">SVG exportieren</button>
          <button id="approve-btn" type="button" class="primary">
            SVG freigeben &amp; weiter
          </button>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
        <img id="uploaded-image" alt="" hidden />
      </section>

      <section class="panel preview">
        <h2>Live-Vorschau</h2>
        <div id="preview" class="preview-box" aria-label="SVG Vorschau"></div>
        <details>
          <summary>Rohdaten (SVG-Markup)</summary>
          <pre id="svg-code"></pre>
        </details>
      </section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
